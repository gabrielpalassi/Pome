name: Code Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun run verify

      - name: Run tests
        run: bun run test

      - name: Build production bundle
        run: bun run bundle

      - name: Verify offline sources match the lockfile
        run: bun run flatpak:sources --check
