app-id: io.github.gabrielpalassi.Pome
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
command: pome
finish-args:
  # Required for the sandboxed iCloud sign-in window
  - --share=network
  # Required by Chromium when rendering the visible Wayland sign-in window
  - --share=ipc
  # Shows the iCloud sign-in window from the sandboxed app
  - --socket=wayland
  # Enables Chromium rendering acceleration for the sign-in window
  - --device=dri
  # Allows flatpak-spawn --host so Pome can manage the user's host rclone mount
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: bun
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/oven-sh/bun/releases/download/bun-v1.4.4/bun-linux-x64-baseline.zip
        sha256: e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76
    build-commands:
      - install -Dm755 bun /app/bin/bun
  - name: rclone
    buildsystem: simple
    sources:
      - type: archive
        url: https://downloads.rclone.org/v1.75.2/rclone-v1.75.2-linux-amd64.zip
        sha256: 349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702
      - type: file
        url: https://raw.githubusercontent.com/rclone/rclone/v1.75.2/COPYING
        sha256: 8cd2e9e750b90a04b7d82dbbca3930c696ae0309d7c10464f90a44f45754cd04
    build-commands:
      - install -Dm755 rclone /app/lib/pome/rclone
      - install -Dm644 COPYING /app/share/licenses/rclone/COPYING
  - name: pome
    buildsystem: simple
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .flatpak-builder
          - build-dir
          - node_modules
          - dist
      - type: archive
        url: https://storage.googleapis.com/chrome-for-testing-public/147.0.7727.57/linux64/chrome-linux64.zip
        sha256: 62a8d3e2d62c049f9dea6030e41302e50595ba21863eb60ed12d0487a415c1c4
        dest: chrome
      - generated-sources.json
    build-commands:
      - mkdir -p /app/lib/pome /app/bin /app/share/applications /app/share/metainfo
      - cp -a package.json bun.lock bunfig.toml tsconfig.json src /app/lib/pome/
      - mkdir -p /app/lib/pome/chrome
      - cp -a chrome/. /app/lib/pome/chrome/
      - cd /app/lib/pome && bun install --offline --frozen-lockfile --production --ignore-scripts --cache-dir /run/build/pome/flatpak-bun/cache
      - cd /app/lib/pome && bun run bundle
      - rm -rf /app/lib/pome/src
      - test -x /app/lib/pome/chrome/chrome
      - chmod +x /app/lib/pome/dist/pome.js
      - ln -s /app/lib/pome/dist/pome.js /app/bin/pome
      - install -Dm644 data/io.github.gabrielpalassi.Pome.desktop /app/share/applications/io.github.gabrielpalassi.Pome.desktop
      - install -Dm644 data/io.github.gabrielpalassi.Pome.metainfo.xml /app/share/metainfo/io.github.gabrielpalassi.Pome.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.gabrielpalassi.Pome.svg /app/share/icons/hicolor/scalable/apps/io.github.gabrielpalassi.Pome.svg
      - install -Dm644 data/icons/hicolor/512x512/apps/io.github.gabrielpalassi.Pome.notification.png /app/share/icons/hicolor/512x512/apps/io.github.gabrielpalassi.Pome.notification.png
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.gabrielpalassi.Pome-symbolic.svg /app/share/icons/hicolor/symbolic/apps/io.github.gabrielpalassi.Pome-symbolic.svg
